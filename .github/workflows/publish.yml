name: Publish packages to npm

on:
  push:
    tags:
      - "*@*"     # package-scoped format (core@0.0.1, cli@0.0.11, etc.)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm build --filter=@rewrlution/papyrus-core...

      - name: Build packages
        run: pnpm build --filter=@rewrlution/papyrus-cli...

      - name: Run tests
        run: pnpm test --filter=@rewrlution/papyrus-core --filter=@rewrlution/papyrus-shared --filter=@rewrlution/papyrus-cli

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm build --filter=@rewrlution/papyrus-core...

      - name: Build packages
        run: pnpm build --filter=@rewrlution/papyrus-cli...

      - name: Publish core package to npm
        run: pnpm publish --filter=@rewrlution/papyrus-core --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish shared package to npm
        run: pnpm publish --filter=@rewrlution/papyrus-shared --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI to npm
        run: pnpm publish --filter=@rewrlution/papyrus-cli --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
